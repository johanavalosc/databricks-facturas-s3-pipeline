<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec7211"/>
      <stop offset="100%" stop-color="#eb5f07"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a05a2c"/>
      <stop offset="100%" stop-color="#cd7f32"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#708090"/>
      <stop offset="100%" stop-color="#a8b2be"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="1040" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="60" y="52" fill="#f8fafc" font-size="20" font-weight="bold">ARQUITECTURA LAKEHOUSE FACTURACIÓN B2B Y AUDITORÍA FISCAL</text>
  <text x="60" y="74" fill="#94a3b8" font-size="13">Databricks Medallion + AWS S3 (O7) + Unity Catalog Governance + Lakeflow Jobs DAG</text>
  <rect x="890" y="38" width="155" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="967" y="59" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">JOHAN AVALOS</text>

  <!-- Box 1: Storage & Ingestion -->
  <rect x="30" y="110" width="280" height="540" rx="14" fill="url(#cardBg)" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#glow)"/>
  <rect x="50" y="125" width="160" height="28" rx="6" fill="#431407" stroke="#ea580c" stroke-width="1"/>
  <text x="130" y="143" fill="#fdba74" font-size="12" font-weight="bold" text-anchor="middle">1. FUENTE &amp; S3 (O7)</text>

  <!-- Facturas Source Card -->
  <rect x="50" y="175" width="240" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="202" fill="#e2e8f0" font-size="14" font-weight="bold">Facturas Electrónicas</text>
  <text x="70" y="224" fill="#94a3b8" font-size="12">Formato JSON v4.4 Hacienda CR</text>
  <text x="70" y="244" fill="#38bdf8" font-size="11">&#8226; 8 Facturas en 2 Lotes (USD y CRC)</text>

  <!-- AWS S3 Card -->
  <rect x="50" y="310" width="240" height="105" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="70" y="325" width="70" height="20" rx="4" fill="url(#s3Grad)"/>
  <text x="105" y="339" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">AWS S3</text>
  <text x="70" y="365" fill="#f8fafc" font-size="13" font-weight="bold">nautilus-facturas01</text>
  <text x="70" y="385" fill="#cbd5e1" font-size="11">s3://.../facturas/lote_1/ (5)</text>
  <text x="70" y="400" fill="#cbd5e1" font-size="11">s3://.../facturas/lote_2/ (3)</text>

  <!-- UC Volume Card -->
  <rect x="50" y="455" width="240" height="105" rx="10" fill="#1e293b" stroke="#ff3621" stroke-width="1.5"/>
  <rect x="70" y="470" width="130" height="20" rx="4" fill="#7f1d1d"/>
  <text x="135" y="484" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">UNITY CATALOG VOLUME</text>
  <text x="70" y="510" fill="#f8fafc" font-size="12" font-weight="bold">pf_avalos.bronze.landing</text>
  <text x="70" y="530" fill="#94a3b8" font-size="11">Staging seguro en Free Edition</text>
  <text x="70" y="545" fill="#4ade80" font-size="11">Idempotente / Sin duplicados</text>

  <!-- Arrows Box 1 -->
  <path d="M 170 270 L 170 305" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 170 415 L 170 450" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Box 2: Medallion Architecture -->
  <rect x="330" y="110" width="430" height="540" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="350" y="125" width="210" height="28" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="455" y="143" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="middle">2. MEDALLION LAKEHOUSE</text>

  <!-- Bronze Card -->
  <rect x="350" y="175" width="390" height="100" rx="10" fill="#1e293b" stroke="#cd7f32" stroke-width="2"/>
  <rect x="370" y="190" width="100" height="22" rx="4" fill="url(#bronzeGrad)"/>
  <text x="420" y="205" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BRONZE LAYER</text>
  <text x="480" y="206" fill="#f8fafc" font-size="13" font-weight="bold">bronze.facturas_raw</text>
  <text x="370" y="230" fill="#cbd5e1" font-size="11">&#8226; Ingesta con Auto Loader (format("cloudFiles"))</text>
  <text x="370" y="248" fill="#cbd5e1" font-size="11">&#8226; schemaLocation + checkpoints para Exactly-Once</text>
  <text x="370" y="265" fill="#4ade80" font-size="11">&#8226; Metadatos: _metadata.file_path + fecha_ingesta (8 filas)</text>

  <!-- Silver Card -->
  <rect x="350" y="325" width="390" height="135" rx="10" fill="#1e293b" stroke="#a8b2be" stroke-width="2"/>
  <rect x="370" y="340" width="95" height="22" rx="4" fill="url(#silverGrad)"/>
  <text x="417" y="355" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">SILVER LAYER</text>
  <text x="475" y="356" fill="#f8fafc" font-size="13" font-weight="bold">silver.facturas_validadas</text>
  <text x="370" y="380" fill="#cbd5e1" font-size="11">&#8226; Normalización Cambiaria: USD * 520 = CRC</text>
  <text x="370" y="398" fill="#cbd5e1" font-size="11">&#8226; Deduplicación: QUALIFY ROW_NUMBER() por clave_hacienda</text>
  <text x="370" y="416" fill="#cbd5e1" font-size="11">&#8226; INNER JOIN con dimensional: silver.cat_proveedores</text>
  <text x="370" y="434" fill="#38bdf8" font-size="11">&#8226; Liquid Clustering: CLUSTER BY (periodo_fiscal, categoria_gasto)</text>
  <text x="370" y="451" fill="#4ade80" font-size="11">&#8226; Métricas antes/después: 8 filas validadas sin nulos</text>

  <!-- Gold Card -->
  <rect x="350" y="510" width="390" height="115" rx="10" fill="#1e293b" stroke="#ffd700" stroke-width="2"/>
  <rect x="370" y="525" width="85" height="22" rx="4" fill="url(#goldGrad)"/>
  <text x="412" y="540" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">GOLD LAYER</text>
  <text x="465" y="541" fill="#f8fafc" font-size="13" font-weight="bold">gold.gastos_por_departamento</text>
  <text x="370" y="565" fill="#cbd5e1" font-size="11">&#8226; Agregación analítica por departamento y categoría</text>
  <text x="370" y="583" fill="#f59e0b" font-size="11">&#8226; Cálculo oficial del crédito fiscal IVA deducible (D-104)</text>
  <text x="370" y="601" fill="#ef4444" font-size="11">&#8226; Reglas CHECK: gasto_total &gt;= 0 AND credito_fiscal_iva &gt;= 0</text>
  <text x="370" y="618" fill="#f87171" font-size="11">&#8226; Evidencia de Rechazo: Inserción corrupta de -50K bloqueada</text>

  <!-- Arrows in Medallion -->
  <path d="M 290 510 L 320 510 L 320 225 L 345 225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545 275 L 545 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545 460 L 545 505" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Governance & Lakeflow -->
  <rect x="780" y="110" width="290" height="540" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="800" y="125" width="240" height="28" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="920" y="143" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">3. GOBERNANZA &amp; LAKEFLOW</text>

  <!-- Unity Catalog Governance Card -->
  <rect x="800" y="175" width="250" height="145" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="820" y="200" fill="#60a5fa" font-size="13" font-weight="bold">Gobernanza Unity Catalog</text>
  <text x="820" y="222" fill="#cbd5e1" font-size="11">&#8226; Mínimo Privilegio (account users)</text>
  <text x="820" y="238" fill="#94a3b8" font-size="10">  USE CATALOG + USE SCHEMA + SELECT</text>
  <text x="820" y="258" fill="#cbd5e1" font-size="11">&#8226; Column Masking (mask_cedula)</text>
  <text x="820" y="274" fill="#94a3b8" font-size="10">  Cédulas anonimizadas para no financieros</text>
  <text x="820" y="294" fill="#cbd5e1" font-size="11">&#8226; Clasificación por Tags (SET TAGS)</text>
  <text x="820" y="310" fill="#94a3b8" font-size="10">  PII: Confidencial / Dominio: Financiero</text>

  <!-- Lakeflow Jobs Card -->
  <rect x="800" y="345" width="250" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="370" fill="#34d399" font-size="13" font-weight="bold">Lakeflow Jobs (DAG)</text>
  <text x="820" y="392" fill="#cbd5e1" font-size="11">&#8226; Tareas: Bronze &#10140; Silver &#10140; Gold</text>
  <text x="820" y="410" fill="#cbd5e1" font-size="11">&#8226; Serverless Compute (Run 47s)</text>
  <text x="820" y="428" fill="#cbd5e1" font-size="11">&#8226; Reintentos: max_retries = 2 en Bronze</text>
  <text x="820" y="446" fill="#cbd5e1" font-size="11">&#8226; Trigger: Cron 06:00 AM (CR Time)</text>
  <text x="820" y="470" fill="#4ade80" font-size="12" font-weight="bold">&#10003; RUN SUCCESS (75343079404296)</text>

  <!-- CI/CD Card -->
  <rect x="800" y="515" width="250" height="110" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="820" y="540" fill="#c084fc" font-size="13" font-weight="bold">CI/CD &amp; Bundles (C4)</text>
  <text x="820" y="562" fill="#cbd5e1" font-size="11">&#8226; Databricks Git Folders (GitHub repo)</text>
  <text x="820" y="580" fill="#cbd5e1" font-size="11">&#8226; Feature branch &#10140; PR #1 a main</text>
  <text x="820" y="598" fill="#cbd5e1" font-size="11">&#8226; databricks.yml (DABs: dev &amp; prod)</text>
</svg>
